version: "3"
endpoints:
  - name: backend
    description: Pokesky Backend
    # comment if free plan to generate random url
    url: backend.pokesky.ngrok.app
    upstream:
      url: 3000  # Port de votre backend
      protocol: http1
  - name: kafka-proxy
    description: Pokesky Kafka REST Proxy
    # comment if free plan to generate random url
    url: kafka-proxy.pokesky.ngrok.app
    upstream:
      url: 8082  # Kafka REST Proxy
      protocol: http1
  - name: kafka-broker
    description: Kafka Broker (requires paid plan)
    # url: kafka-broker.pokesky.ngrok.app
    upstream:
      url: 9092  # Kafka broker
      protocol: tcp

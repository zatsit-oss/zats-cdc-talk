# Créer un secret pour accéder à GitHub Container Registry
#
# Prérequis :
# 1. Créer un Personal Access Token sur GitHub avec le scope 'read:packages'
#    https://github.com/settings/tokens/new
# 2. Exporter le token : export GITHUB_TOKEN=ghp_xxxxxxxxxxxx
#
# Puis créer le secret :
# kubectl create secret docker-registry github-registry \
#   --docker-server=ghcr.io \
#   --docker-username=votre-username \
#   --docker-password=$GITHUB_TOKEN \
#   --docker-email=votre-email@example.com
#
# Alternative : créer depuis un fichier
# echo -n 'votre-username:ghp_xxxx' | base64
# Puis remplacer AUTH_TOKEN ci-dessous

apiVersion: v1
kind: Secret
metadata:
  name: github-registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    # Remplacer par votre token encodé en base64
    # echo -n '{"auths":{"ghcr.io":{"auth":"BASE64_DE_USERNAME:TOKEN"}}}' | base64

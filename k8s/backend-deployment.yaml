apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: github-registry
      containers:
      - name: backend
        image: ghcr.io/zatsit-oss/zats-cdc-talk/backend:latest
        # image: ghcr.io/zatsit-oss/zats-cdc-talk/backend-cdc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "DCD"
          # value: "CDC"
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        # PostgreSQL
        - name: DB_HOST
          value: "postgresql-pokesky"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "pikachu"
        - name: DB_PASSWORD
          value: "zatsit"
        - name: DB_NAME
          value: "pokesky"
        # Kafka (accès direct interne)
        - name: KAFKA_BROKERS
          value: "kafka1:19092"
        # CORS
        - name: FRONTEND_URL
          value: "http://frontend"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    nodePort: 30300
